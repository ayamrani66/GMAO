<!-- chatbot.component.html -->
<div class="chatbot-wrapper" *ngIf="isAuthenticated">

  <!-- ── FAB ── -->
  <button class="chat-fab" (click)="toggleChat()" [class.open]="isOpen" aria-label="Ouvrir l'assistant GMAO">
    <span class="fab-icon" *ngIf="!isOpen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </span>
    <span class="fab-icon" *ngIf="isOpen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </span>
    <span class="unread-badge" *ngIf="unreadCount > 0 && !isOpen">{{ unreadCount }}</span>
  </button>

  <!-- ── Panneau ── -->
  <div class="chat-panel" [class.visible]="isOpen" role="dialog" aria-label="Assistant GMAO">

    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <div class="avatar-wrap">
          <div class="bot-avatar">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M9 9a2 2 0 0 0-2 2 2 2 0 0 0 2 2 2 2 0 0 0 2-2 2 2 0 0 0-2-2m6 0a2 2 0 0 0-2 2 2 2 0 0 0 2 2 2 2 0 0 0 2-2 2 2 0 0 0-2-2z"/>
            </svg>
          </div>
          <span class="status-dot" [class.loading]="isLoading"></span>
        </div>
        <div class="header-info">
          <span class="bot-name">Assistant GMAO</span>
          <span class="bot-status">{{ isLoading ? 'Analyse en cours…' : 'Données en temps réel' }}</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" (click)="clearConversation()" title="Réinitialiser la conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-area" #messagesContainer>

      <!-- Suggestions initiales -->
      <div class="suggestions-wrap" *ngIf="messages.length <= 1">
        <p class="suggestions-label">Suggestions rapides</p>
        <div class="suggestions-grid">
          <button
            class="suggestion-chip"
            *ngFor="let s of quickSuggestions"
            (click)="useSuggestion(s)">
            {{ s }}
          </button>
        </div>
      </div>

      <!-- Boucle de messages -->
      <div
        class="message-row"
        *ngFor="let msg of messages"
        [class.user-row]="msg.role === 'user'"
        [class.bot-row]="msg.role === 'assistant'">

        <!-- Avatar bot -->
        <div class="msg-avatar" *ngIf="msg.role === 'assistant'">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M9 9a2 2 0 0 0-2 2 2 2 0 0 0 2 2 2 2 0 0 0 2-2 2 2 0 0 0-2-2m6 0a2 2 0 0 0-2 2 2 2 0 0 0 2 2 2 2 0 0 0 2-2 2 2 0 0 0-2-2z"/>
          </svg>
        </div>

        <!-- Bulle -->
        <div
          class="bubble"
          [class.user-bubble]="msg.role === 'user'"
          [class.bot-bubble]="msg.role === 'assistant'">

          <!-- Loading dots -->
          <div class="loading-dots" *ngIf="msg.loading">
            <span></span><span></span><span></span>
          </div>

          <!-- Contenu bot avec HTML (markdown rendu) -->
          <div
            *ngIf="!msg.loading && msg.role === 'assistant'"
            class="msg-text"
            [innerHTML]="msg.content | formatContent">
          </div>

          <!-- Contenu user (texte brut) -->
          <span *ngIf="!msg.loading && msg.role === 'user'" class="msg-text">{{ msg.content }}</span>

          <!-- Fichiers joints (bulle user) -->
          <div class="msg-files" *ngIf="msg.files && msg.files.length > 0">
            <span class="msg-file-tag" *ngFor="let f of msg.files">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
              {{ f }}
            </span>
          </div>

          <span class="msg-time" *ngIf="!msg.loading">{{ formatTime(msg.timestamp) }}</span>
        </div>
      </div>

    </div>

    <!-- Fichiers attachés en attente -->
    <div class="attached-files" *ngIf="attachedFileNames.length > 0">
      <div class="file-chip" *ngFor="let name of attachedFileNames; let i = index">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        {{ name }}
        <button (click)="removeFile(i)" aria-label="Retirer le fichier">✕</button>
      </div>
    </div>

    <!-- Saisie -->
    <div class="input-area">
      <textarea
        #inputField
        class="chat-input"
        [(ngModel)]="inputText"
        (keydown)="onKeyDown($event)"
        (input)="autoResize($event)"
        placeholder="Posez votre question sur les données GMAO…"
        rows="1"
        [disabled]="isLoading"
        aria-label="Message">
      </textarea>
      <div class="input-actions">
        <button class="attach-btn" (click)="fileInput.click()" title="Joindre un fichier (TXT, CSV, JSON)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input #fileInput type="file" accept=".txt,.csv,.json" multiple style="display:none" (change)="onFileSelected($event)">
        <button
          class="send-btn"
          (click)="sendMessage()"
          [disabled]="!inputText.trim() || isLoading"
          aria-label="Envoyer">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>

  </div>
</div>
